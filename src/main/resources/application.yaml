server:
  port: 8080

spring:
  application:
    name: assessment-collection
  datasource:
    url: jdbc:mysql://localhost:3306/assessment_collection_app?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        # Ensures Hibernate uses the correct MySQL syntax
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Optional: Lombok configuration for better logging/debugging
  main:
    banner-mode: "off"

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE