version: '3.8'

services:
  app:
    build: .
    ports:
      - "9080:9080"
    environment:
      - SPRING_PROFILES_ACTIVE=qa
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=pourashava
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - JWT_SECRET=eW91ci1zZWNyZXQta2V5LW11c3QtYmUtbG9uZy1lbm91Z2gtZm9yLWhzMjU2
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pourashava
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
